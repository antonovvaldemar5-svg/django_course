{% extends 'mailing/base.html' %}

{% block content %}
<h1 class="mb-4">Статистика</h1>
<div class="row">
    <div class="col-md-4"><div class="card text-white bg-primary mb-3"><div class="card-header">Всего рассылок</div><div class="card-body"><h5 class="card-title">{{ total_mailings }}</h5></div></div></div>
    <div class="col-md-4"><div class="card text-white bg-success mb-3"><div class="card-header">Активных рассылок</div><div class="card-body"><h5 class="card-title">{{ active_mailings }}</h5></div></div></div>
    <div class="col-md-4"><div class="card text-white bg-info mb-3"><div class="card-header">Уникальных клиентов</div><div class="card-body"><h5 class="card-title">{{ unique_clients }}</h5></div></div></div>
</div>
<a href="{% url 'mailing:mailing_list' %}" class="btn btn-primary">Перейти к рассылкам</a>
{% endblock %}
